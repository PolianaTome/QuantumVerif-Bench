name: verify

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/

  # esbmc-verify installs ESBMC via its official PPA (confirmed real and
  # documented at https://github.com/esbmc/esbmc, supporting Ubuntu 22.04 and
  # 24.04: `sudo add-apt-repository ppa:esbmc/esbmc && sudo apt update &&
  # sudo apt install esbmc`) and then runs scripts/run_esbmc.sh on every
  # benchmark.
