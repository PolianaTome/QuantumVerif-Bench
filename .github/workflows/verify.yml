  # podem ser lentas ou instáveis, e isso nunca foi de fato testado em um
  # runner do GitHub Actions durante o desenvolvimento (só em um ambiente
  # local WSL2 com o ESBMC já instalado) -- então deve ser validado uma vez,
  # cronometrado, e só então descomentado em vez de assumido como funcional.
