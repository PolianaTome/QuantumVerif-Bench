# Ponto de entrada do CI: roda os smoke tests rápidos (sem ESBMC) a cada
# push e pull request. A verificação formal com o ESBMC em si AINDA NÃO
# roda no CI (veja o job esbmc-verify desabilitado abaixo).
name: verify

on:
  push:
  pull_request:

jobs:
  # Executa cada benchmark com o CPython puro (tests/test_smoke.py) para
  # pegar erros básicos rapidamente, sem instalar nem chamar o ESBMC.
  smoke-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/

  # esbmc-verify instala o ESBMC via seu PPA oficial (confirmado real e
  # documentado em https://github.com/esbmc/esbmc, com suporte a Ubuntu
  # 22.04 e 24.04: `sudo add-apt-repository ppa:esbmc/esbmc && sudo apt
  # update && sudo apt install esbmc`) e depois roda scripts/run_esbmc.sh em
  # cada benchmark.
  #
